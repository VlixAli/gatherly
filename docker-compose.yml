services:

  postgres:
    image: postgres:18
    container_name: gatherly-postgres
    environment:
      POSTGRES_DB: gatherly
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly
    ports:
      - "5434:5432"
    volumes:
      - gatherly-postgres-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: gatherly-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  gatherly-postgres-data: